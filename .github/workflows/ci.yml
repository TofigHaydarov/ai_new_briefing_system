name: CI

# Runs on every push to main and on every pull request targeting main:
# lint -> type-check -> test (coverage gate) -> docker build.
#
# The test and docker-build jobs are blocking: a failure there turns the
# PR red. Ruff and mypy report their findings in the job log without
# blocking a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy==2.3.1

      - name: Run ruff (lint)
        run: ruff check src tests
        continue-on-error: true  # informational, does not block merges

      - name: Run mypy (type-check)
        run: mypy --ignore-missing-imports --explicit-package-bases --follow-imports=silent src
        continue-on-error: true  # informational, does not block merges

  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio respx

      # --cov-fail-under=60 fails the job if coverage drops below the
      # 60% threshold the brief requires. All tests run offline.
      - name: Run tests with coverage
        env:
          # Dummy values so config.py can load without real secrets.
          # Tests never call real providers; everything is mocked.
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-sonnet-4-6
          ANTHROPIC_API_KEY: test-key-not-real
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
          OPENAI_API_KEY: test-key-not-real
        run: |
          python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t newsbrief:ci .