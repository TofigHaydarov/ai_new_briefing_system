name: CI

# Runs on every push to main and on every pull request targeting main.
# This satisfies the "CI bonus" requirement in the project brief:
# lint -> type-check -> test (with coverage gate) -> docker build.
#
# SOFT-LAUNCH MODE: src/ is still being written by teammates, so every
# step below has `continue-on-error: true` for now — CI will run and
# show you what's red/green, but a failing step will NOT block a PR from
# merging yet. Once most modules exist and tests are passing for real,
# remove the `continue-on-error: true` lines (search for "TODO: tighten")
# and turn on branch protection (Settings > Branches > Require status
# checks to pass before merging) to actually enforce this.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      # Adjust the target paths (src, tests) if your layout differs.
      - name: Run ruff (lint)
        run: ruff check src tests
        continue-on-error: true  # TODO: tighten — remove once src/ is stable

      - name: Run mypy (type-check)
        run: mypy src
        continue-on-error: true  # TODO: tighten — remove once type hints are in place everywhere

  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      # --cov-fail-under=60 makes the job fail (red X on the PR) if
      # coverage drops below the 60% threshold the brief requires.
      - name: Run tests with coverage
        env:
          # Dummy values so config.py / pydantic-settings can load without
          # real secrets. Tests must never call real providers anyway —
          # everything should be mocked via conftest.py fakes.
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-sonnet-4-6
          ANTHROPIC_API_KEY: test-key-not-real
          EMBEDDING_PROVIDER: openai
          EMBEDDING_MODEL: text-embedding-3-small
          OPENAI_API_KEY: test-key-not-real
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60
        continue-on-error: true  # TODO: tighten — remove once modules + tests are passing for real

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t newsbrief:ci .
        continue-on-error: true  # TODO: tighten — remove once Dockerfile exists and builds cleanly